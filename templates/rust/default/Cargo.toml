[package]
name = "tt-wasm-guest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tarantool-wasm = { path = ".tt-wasm-sdk-rust" }
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "example:{{.World}}"

[package.metadata.component.target]
path = "wit"
world = "{{.World}}"
