name: Wasm builder images

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: builder-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: read
    uses: ./.github/workflows/builder-images-native.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/builder-images-native.yml
    with:
      release: true
